# Tool configuration only; dependencies live in requirements*.txt.

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = [
    "B008",  # FastAPI's Depends()/Header() in defaults is the intended idiom
    "RUF001", "RUF002", "RUF003",  # Bangla text and typographic dashes are intentional
]

[tool.mypy]
python_version = "3.12"
packages = ["app"]
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true
