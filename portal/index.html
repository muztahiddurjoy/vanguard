<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="The Digital Legal Aid System (DLAS): its hotline number and a link to each of its apps."
    />
    <meta name="theme-color" content="#1e2f5c" />
    <title>Digital Legal Aid System · DLAS</title>
    <!-- The dashboards bundle these two typefaces; this page takes them from Google Fonts. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Anek+Bangla:wght@400..700&family=Inter:wght@400..700&display=swap"
    />
    <style>
      /* The dashboards' palette (dlao-dashboard/src/index.css): institutional navy on white. */
      :root {
        color-scheme: light;
        --background: oklch(0.984 0.004 255);
        --foreground: oklch(0.21 0.035 262);
        --card: oklch(1 0 0);
        --primary: oklch(0.33 0.1 262);
        --primary-foreground: oklch(0.985 0.005 255);
        --muted-foreground: oklch(0.47 0.03 260);
        --border: oklch(0.905 0.012 258);
        --ring: oklch(0.5 0.16 262);
        --radius: 0.5rem;

        --sidebar: oklch(0.25 0.07 263);
        --sidebar-foreground: oklch(0.93 0.015 258);
        --sidebar-primary: oklch(0.985 0.005 255);
        --sidebar-primary-foreground: oklch(0.25 0.07 263);
        --sidebar-accent: oklch(0.33 0.08 263);
        --sidebar-ring: oklch(0.8 0.1 255);

        --font-sans: "Inter", "Anek Bangla", ui-sans-serif, system-ui, sans-serif;
        --font-mono: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;

        /* As in the dashboards: Anek Bangla looks smaller, so Bangla scales the root up. */
        --lang-scale: 1;
        font-size: calc(100% * var(--lang-scale));
      }

      :root:lang(bn) {
        --font-sans: "Anek Bangla", "Inter", ui-sans-serif, system-ui, sans-serif;
        --lang-scale: 1.0625;
      }

      *,
      ::before,
      ::after {
        box-sizing: border-box;
      }

      body {
        display: flex;
        flex-direction: column;
        min-height: 100svh;
        margin: 0;
        background: var(--background);
        color: var(--foreground);
        font-family: var(--font-sans);
        line-height: 1.5;
        -webkit-font-smoothing: antialiased;
      }

      /* Bengali glyphs have tall conjuncts and matras; give them more room. */
      :lang(bn) body {
        line-height: 1.6;
      }

      h1,
      h2,
      h3,
      p {
        margin: 0;
      }

      /* Lucide's stroke style; the symbols inherit it through <use>. */
      .icon {
        flex-shrink: 0;
        width: 1rem;
        height: 1rem;
        fill: none;
        stroke: currentColor;
        stroke-width: 2;
        stroke-linecap: round;
        stroke-linejoin: round;
      }

      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip-path: inset(50%);
        white-space: nowrap;
      }

      .skip-link {
        position: absolute;
        top: 0.5rem;
        left: 0.5rem;
        z-index: 10;
        padding: 0.5rem 0.75rem;
        border-radius: calc(var(--radius) * 0.8);
        background: var(--card);
        color: var(--foreground);
        font-weight: 600;
        transform: translateY(-200%);
      }

      .skip-link:focus {
        transform: none;
      }

      .container {
        width: 100%;
        max-width: 72rem;
        margin-inline: auto;
        padding-inline: 1rem;
      }

      @media (min-width: 640px) {
        .container {
          padding-inline: 1.5rem;
        }
      }

      /* The top of the page is the sign-in pages' navy panel. */
      .masthead {
        background: var(--sidebar);
        color: var(--sidebar-foreground);
      }

      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 1rem;
        padding-block: 1rem;
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 0.75rem;
        min-width: 0;
      }

      .brand-mark {
        display: flex;
        flex-shrink: 0;
        align-items: center;
        justify-content: center;
        width: 2.75rem;
        height: 2.75rem;
        border-radius: var(--radius);
        background: var(--sidebar-primary);
        color: var(--sidebar-primary-foreground);
      }

      .brand-mark .icon {
        width: 1.5rem;
        height: 1.5rem;
      }

      .brand-title {
        font-size: 1rem;
        font-weight: 600;
        line-height: 1.25;
      }

      .brand-sub {
        font-size: 0.875rem;
        line-height: 1.25;
        color: color-mix(in oklch, var(--sidebar-foreground) 75%, transparent);
      }

      @media (min-width: 640px) {
        .topbar {
          padding-block: 1.5rem;
        }

        .brand-title {
          font-size: 1.125rem;
        }
      }

      main {
        flex: 1;
        padding-block: 2rem 3rem;
      }

      .site-footer {
        padding-block: 1.5rem;
        border-top: 1px solid var(--border);
        color: var(--muted-foreground);
        font-size: 0.875rem;
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        ::before,
        ::after {
          animation-duration: 0.01ms !important;
          transition-duration: 0.01ms !important;
        }
      }
    </style>
  </head>
  <body>
    <!-- Lucide icons, as in the dashboards -->
    <svg xmlns="http://www.w3.org/2000/svg" hidden>
      <symbol id="i-scale" viewBox="0 0 24 24">
        <path d="m16 16 3-8 3 8c-.87.65-1.92 1-3 1s-2.13-.35-3-1Z" />
        <path d="m2 16 3-8 3 8c-.87.65-1.92 1-3 1s-2.13-.35-3-1Z" />
        <path d="M7 21h10" />
        <path d="M12 3v18" />
        <path d="M3 7h2c2 0 5-1 7-2 2 1 5 2 7 2h2" />
      </symbol>
    </svg>

    <a class="skip-link" href="#main" data-i18n="skip">Skip to main content</a>

    <header class="masthead">
      <div class="container">
        <div class="topbar">
          <div class="brand">
            <span class="brand-mark">
              <svg class="icon" aria-hidden="true"><use href="#i-scale" /></svg>
            </span>
            <div>
              <h1 class="brand-title" data-i18n="brand.title">Digital Legal Aid System</h1>
              <p class="brand-sub">DLAS</p>
            </div>
          </div>
        </div>
      </div>
    </header>

    <main id="main" class="container" tabindex="-1"></main>

    <footer class="site-footer">
      <div class="container">
        <p data-i18n="footer">Digital Legal Aid System (DLAS)</p>
      </div>
    </footer>
  </body>
</html>
